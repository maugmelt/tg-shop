<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>Витрина</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button id="close" class="pill" type="button">✕ Закрыть</button>
      <div id="shop-name" class="brand">Витрина</div>
      <button id="more" class="icon-btn" type="button" aria-label="Условия покупки">•••</button>
    </header>

    <div id="client">
      <div class="tools">
        <div id="chips" class="toolrow"></div>
        <div id="filters" class="filters hidden"></div>
      </div>
      <main id="grid" class="grid"></main>
      <section id="view-fav" class="view hidden"></section>
      <section id="view-cart" class="view hidden"></section>
      <nav class="nav">
        <button type="button" data-tab="catalog" class="active">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Каталог
        </button>
        <button type="button" data-tab="fav">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 19s-6.2-3.9-6.2-8A3.4 3.4 0 0 1 12 8.2 3.4 3.4 0 0 1 18.2 11c0 4.1-6.2 8-6.2 8z"/></svg>
          Избранное
        </button>
        <button type="button" data-tab="cart">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 7h15l-1.6 8.2a2 2 0 0 1-2 1.6H9.2a2 2 0 0 1-2-1.6L5.2 4H3"/><circle cx="9" cy="20" r="1.2" fill="currentColor"/><circle cx="18" cy="20" r="1.2" fill="currentColor"/></svg>
          Корзина
        </button>
      </nav>
    </div>

    <section id="admin" class="admin hidden">
      <h1>Витрина</h1>
      <p class="muted">Эти позиции видят клиенты в каталоге.</p>
      <form id="editor">
        <input id="f-id" type="hidden" value="">
        <input id="f-title" type="text" maxlength="120" placeholder="Название" autocomplete="off" required>
        <input id="f-price" type="text" inputmode="numeric" placeholder="Цена" autocomplete="off" required>
        <input id="f-category" type="text" maxlength="40" placeholder="Категория, например Куртки" autocomplete="off" required>
        <div id="f-sizes" class="sizes"></div>
        <label class="file">Фото<input id="f-photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <label class="check"><input id="f-active" type="checkbox" checked> Показывать в каталоге</label>
        <div class="actions">
          <button class="primary" id="f-save" type="submit">Добавить</button>
          <button class="ghost" id="f-reset" type="button">Сбросить</button>
        </div>
        <p id="f-error" class="error"></p>
      </form>
      <div id="admin-list"></div>
      <a class="quiet" href="/">Открыть каталог</a>
    </section>

    <div id="sheet" class="overlay hidden"></div>
    <div id="terms" class="overlay hidden"></div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
